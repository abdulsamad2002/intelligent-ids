version: '3.8'

services:
  backend:
    build:
      context: ./Backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/intelligent_ids
      - NODE_ENV=production
    depends_on:
      - mongodb
    restart: always
    networks:
      - ids-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ids-data:/data/db
    restart: always
    networks:
      - ids-network

  dashboard:
    build:
      context: ./Dashboard
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    restart: always
    networks:
      - ids-network

  ids-engine:
    build:
      context: ./IDS
    network_mode: "host" # IDS needs host network mode to sniff packets
    privileged: true # Needs privileges for packet capture
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://localhost:3000
    volumes:
      - ./IDS/output:/app/output
    restart: always

networks:
  ids-network:
    driver: bridge

volumes:
  ids-data:
